services:
  - type: web
    name: tmi-audioid-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.render.bootstrap
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: AUDIOID_ADMIN_API_TOKEN
        generateValue: true
      - key: AUDIOID_CORS_ORIGINS
        value: https://tmi-music.onrender.com
      - key: AUDIOID_MAX_UPLOAD_MB
        value: "100"

  - type: web
    name: tmi-music
    runtime: static
    buildCommand: >-
      rm -rf /tmp/tmi-base /tmp/tmi-overlay &&
      curl -fsSL https://tmi-artifacts.floot.app/_cdn/static/04a20022-9c67-4e6c-8ecb-10df44b8b6fc-tmi_render_base.zip -o /tmp/tmi-base.zip &&
      unzip -q /tmp/tmi-base.zip -d /tmp/tmi-base &&
      cp -a /tmp/tmi-base/tmi_render_ready/. . &&
      curl -fsSL https://tmi-artifacts.floot.app/_cdn/static/5383c5fa-4d0d-4852-ae52-d80f1435fe8c-tmi_overlay_complete_v2.zip -o /tmp/tmi-overlay.zip &&
      unzip -qo /tmp/tmi-overlay.zip -d /tmp/tmi-overlay &&
      cp -a /tmp/tmi-overlay/. . &&
      cd frontend &&
      npm install --no-audit --no-fund &&
      npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://tmi-audioid-api.onrender.com
      - key: VITE_PUBLIC_BASE_URL
        value: https://tmi-music.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
